name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Qualité, tests et Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Générer les images
        run: pnpm images

      - name: Formatage (Prettier)
        run: pnpm format:check

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Typage (TypeScript strict)
        run: pnpm typecheck

      - name: Tests unitaires (Vitest)
        run: pnpm test

      - name: Build (export statique)
        run: pnpm build

      - name: Installer Chromium pour Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests e2e et accessibilité (Playwright + axe)
        run: pnpm test:e2e

      - name: Lighthouse CI (≥ 95 dans chaque catégorie)
        run: pnpm lhci

      - name: Rapports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: |
            playwright-report/
            .lighthouseci/reports/
          retention-days: 14
          if-no-files-found: ignore
